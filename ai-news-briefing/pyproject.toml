[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-news-briefing"
version = "0.1.0"
description = "Agentic morning briefing of the latest AI news: fetches feeds, summarizes via LLM agent (heuristic fallback), writes dated markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ai-news = "ai_news.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]

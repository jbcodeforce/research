[project]
name = "flink-ptf-multitenant-debezium-spanout"
version = "0.1.0"
description = "Mock Debezium CDC producer for multi-tenant span-out PTF research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
debezium-mock-produce = "mt_spanout_kafka.producer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt_spanout_kafka"]

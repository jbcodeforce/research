[project]
name = "flink-statement-triage"
version = "0.1.0"
description = "Agno Team CLI and reusable tools for Confluent Cloud Flink statement troubleshooting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
flink-triage = "flink_stmt_triage.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flink_stmt_triage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
